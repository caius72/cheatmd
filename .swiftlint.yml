# Explicit rule set: a SwiftLint upgrade cannot add rules silently. Version pinned in tools/lint.sh.
included:
  - CheatCore/Sources
  - CheatCore/Tests
  - cheatmd
excluded:
  - CheatCore/.build
strict: true
only_rules:
  - block_based_kvo
  - class_delegate_protocol
  - closure_parameter_position
  - compiler_protocol_init
  - cyclomatic_complexity
  - discarded_notification_center_observer
  - duplicate_imports
  - empty_count
  - empty_enum_arguments
  - file_length
  - force_cast
  - force_try
  - force_unwrapping
  - function_body_length
  - function_parameter_count
  - generic_type_name
  - identifier_name
  - implicitly_unwrapped_optional
  - legacy_cggeometry_functions
  - legacy_constructor
  - legacy_random
  - line_length
  - nesting
  - notification_center_detachment
  - private_over_fileprivate
  - redundant_discardable_let
  - implicit_optional_initialization
  - shorthand_operator
  - syntactic_sugar
  - todo
  - type_body_length
  - unused_closure_parameter
  - unused_enumerated
  - unused_optional_binding
  - weak_delegate
  - xctfail_message
line_length: 110
identifier_name:
  min_length: 1
  excluded: [id]
function_body_length: 60
cyclomatic_complexity: 12
